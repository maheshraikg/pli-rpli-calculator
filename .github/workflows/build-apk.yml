name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # to publish the test APK as a pre-release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          (cd packages/pli_engine && dart pub get)

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test
          (cd packages/pli_engine && dart analyze && dart test && dart run bin/validate_data.dart ../../assets/data)

      # Optional: real release signing. Add repository secrets KEYSTORE_BASE64
      # (base64 of the .jks), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      # Without them the APK is debug-signed: fine for testing, not for Play.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build APK and App Bundle
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          flutter build appbundle --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: pli-rpli-calculator-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # A direct .apk download link (easier on a phone than the zipped
      # artifact). Pre-release, so it is never mistaken for a store build.
      - name: Publish test APK as a pre-release
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "pli-rpli-calculator-build${{ github.run_number }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "pli-rpli-calculator-build${{ github.run_number }}.aab"
          gh release create "build-${{ github.run_number }}" "pli-rpli-calculator-build${{ github.run_number }}.apk" \
            "pli-rpli-calculator-build${{ github.run_number }}.aab" \
            --prerelease --target "${{ github.event.pull_request.head.sha || github.sha }}" \
            --title "Test build ${{ github.run_number }} (sample data, not for customers)" \
            --notes "Test APK from ${{ github.event.pull_request.head.ref || github.ref_name }}. Premium tables are SAMPLE data; do not use for real quotations."
